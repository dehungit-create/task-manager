name: CI Check

on:
  pull_request:
    branches: [develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run eslint
        run: npm run lint
      
      - name: Build project
        run: npm run build